<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Human Geography Trivia Loop</title>
<style>
@font-face {font-family:Atlas Serif;src:url('assets/serif.woff2') format('woff2');font-weight:200 900;font-display:block}
@font-face {font-family:Atlas Sans;src:url('assets/sans.woff2') format('woff2');font-weight:200 900;font-display:block}
* {box-sizing:border-box}
html,body,#root {margin:0;width:100%;height:100%;background:#080f1d;color:#f6eee0;overflow:hidden}
body {font:20px 'Atlas Sans','Segoe UI',sans-serif}
.player {position:fixed;inset:0;display:grid;place-items:center}
canvas {display:block;width:min(100vw,177.77778vh);height:auto;aspect-ratio:16/9}
.start {position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,10,20,.79);padding:20px}
.card {text-align:center;background:#0d1827;border:1px solid #69767b;padding:clamp(24px,5vw,65px);max-width:660px}
.card h1 {font:600 clamp(32px,6vw,70px)/1.04 'Atlas Serif',Georgia,serif;margin:0 0 18px}
.card p {margin:0 0 22px;color:#b2c2cb}
button {background:#162636;color:#f6eee0;border:1px solid #6f8a93;padding:9px 16px;font:600 17px 'Atlas Sans','Segoe UI',sans-serif;cursor:pointer}
button:hover,button:focus-visible {border-color:#e6b875;outline:2px solid #e6b875;outline-offset:3px}
button.primary {background:#e6b875;border-color:#e6b875;color:#080f1d;font-size:19px}
.controls {position:absolute;right:15px;bottom:12px;display:flex;gap:7px;opacity:0;pointer-events:none}
.controls.visible,.controls:focus-within {opacity:1;pointer-events:auto}
.error {color:#e6b875 !important;margin-top:17px !important}
.sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/music-data.js"></script>
<script src="app.js"></script>
</body>
</html>
